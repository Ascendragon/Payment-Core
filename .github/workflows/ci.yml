name: CI

on:
    push:
    pull_request:

jobs:
    tests:
        name: Tests and static analysis
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: payment_core_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U app -d payment_core_test"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        env:
            DATABASE_URL: "pgsql://app:app@127.0.0.1:5432/payment_core_test?serverVersion=16&charset=utf8"

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.4'
                extensions: bcmath, ctype, iconv, intl, mbstring, redis, pdo_pgsql
                coverage: none
                tools: composer:v2

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                path: ~/.cache/composer
                key: composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

            - name: Warm up container
              run: php bin/console cache:warmup

            - name: Coding standards
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Static analysis
              run: vendor/bin/phpstan analyse --no-progress

            - name: Database schema(migrations)
              run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

            - name: Tests
              run: vendor/bin/phpunit


